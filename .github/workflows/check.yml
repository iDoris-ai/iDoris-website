# 本仓库此前没有任何 CI —— 不是「检查都通过」，是「一个检查都没跑过」。
#
# 后果不是理论上的：2026-09-05 合并 PR #21 时，git-guard 的合并闸门拒绝放行，
# 理由正是 "has NO check runs at all — that is not 'nothing failed', it is
# 'nothing ran'"，最后只能带 GIT_GUARD_IGNORE_CHECKS=1 手工放行。同一天还有
# 一个会让整页结构塌掉的 HTML bug，是靠人在浏览器里翻出来的，没有任何自动闸拦住。
#
# 这个 workflow 就跑仓库自己那套自检（scripts/deploy.sh --check），不做别的：
# 它已经是 .pilot.yml 里声明的 preflight，是这个仓库唯一的事实标准。CI 与本地
# 跑的是同一条命令，不另起一套 —— 两套检查迟早会分叉，而分叉的那天没人会发现。
#
# 注意只跑 --check。deploy.sh 不带参数会真的发布到 Cloudflare Pages，
# 那需要 secrets，也绝不该由 PR 触发。
name: check

on:
  pull_request:
  push:
    branches: [main, preview]

# 同一分支上连续推送时，取消上一次还在跑的，只保留最新的一次
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selfcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # deploy.sh 里有针对 macOS 自带 bash 3.2 的写法，在 ubuntu 的 bash 5 上同样成立；
      # 用到的 find / wc / du / grep 都是 runner 自带的。python3 也是自带的。
      - name: 本地自检（页面齐全 · 断链 · 多语 · HTML 结构 · 体积）
        run: ./scripts/deploy.sh --check

      # 单独再跑一次 HTML 判据的正对照。上一步失败会掩盖这一步，而我们恰恰想知道
      # 「判据本身还活着吗」—— 一条不会变红的检查，看起来和真检查一模一样。
      - name: HTML 判据自证能变红（正对照）
        if: always()
        run: python3 scripts/check-html.py --self-test

      # Gateway 路由引擎。三条不可破规则(隐私 override / 预算硬停 / 可解释)
      # 全靠测试兜住,不跑就等于没有。
      - name: Gateway 测试（路由 + 审计）
        if: always()
        run: |
          cd products/gateway
          python3 routing.py --self-test
          python3 test_routing.py
          python3 audit.py
          python3 test_audit.py

      # 变异测试:逐条破坏规则,断言测试确实会变红。
      # 没有这一步,上面那个绿灯证明不了任何事 —— 一个永远绿的测试套件,
      # 看起来和真测试一模一样。
      - name: Gateway 变异测试（证明测试能变红）
        if: always()
        run: products/gateway/mutation_check.sh

      # Assistant 审批队列。三条规矩(出处强制/编辑放行/超时不放行)与自动放行白名单
      # 全靠测试兜住 —— 它保护的是客户的真实订单与口碑。
      - name: Assistant 审批队列测试
        if: always()
        run: |
          cd products/assistant
          python3 approval.py
          python3 test_approval.py

      # 出网闸门。P0 #1 的结论是「风险不在库、在部署配置」——
      # 设了 LANGSMITH_TRACING=true,客户的会议转写稿就会被发到
      # api.smith.langchain.com,而日志照常、功能照常、测试照常绿。
      # 这一步保证那道闸门本身不会悄悄失效,**也保证它真的被接在入口上**。
      - name: Assistant 出网闸门测试
        if: always()
        run: |
          cd products/assistant
          python3 egress_guard.py --self-test
          python3 test_egress_guard.py

      # CI 环境本身也得干净 —— 这里跑的是真实的 --check,不是模拟。
      - name: CI 环境没有追踪配置
        if: always()
        run: python3 products/assistant/egress_guard.py --check

      # 正对照:闸门必须在**脏环境**下真的挡住启动。
      # 只测「干净环境能跑」的话,一个永远放行的闸门也是绿的。
      - name: 脏环境下必须拒绝启动（正对照）
        if: always()
        env:
          LANGSMITH_TRACING: "true"
        run: |
          if python3 products/demo_meeting_to_tasks.py --self-test >/dev/null 2>&1; then
            echo "::error::LANGSMITH_TRACING=true 时演示竟然正常启动了 —— 出网闸门形同虚设"
            exit 1
          fi
          echo "✓ 脏环境下拒绝启动"

      - name: Assistant 变异测试（证明测试能变红）
        if: always()
        run: products/assistant/mutation_check.sh

      # 端到端演示。它断言的不是「演示能跑通」,而是**五条安全属性在真实路径上
      # 没被绕过** —— 单元测试各自绿灯,不代表拼起来还守规矩。
      - name: 端到端演示的安全属性
        if: always()
        run: python3 products/demo_meeting_to_tasks.py --self-test
