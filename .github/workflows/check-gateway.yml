# Gateway 的检查。
#
# **为什么每个产品一个 workflow 文件**：原先所有步骤都挤在 `check.yml` 里，
# 于是两条并行的开发栈各自往同一个文件加步骤，**必然在合并时冲突** ——
# 而冲突内容永远是「两边都该留」，纯属人工搬运。
#
# 拆开之后，动 Gateway 的 PR 只碰这一个文件，跟别的产品的 PR 天然不冲突。
# 代价是 GitHub 上多几个 check 名字；比起每次并行开发都要手工解一次冲突，
# 这个代价便宜得多。
name: check-gateway

on:
  pull_request:
  push:
    branches: [main, preview]

concurrency:
  group: check-gateway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # Gateway 路由引擎。三条不可破规则(隐私 override / 预算硬停 / 可解释)
      # 全靠测试兜住,不跑就等于没有。
      - name: Gateway 测试（路由 + 审计）
        if: always()
        run: |
          cd products/gateway
          python3 routing.py --self-test
          python3 test_routing.py
          python3 audit.py
          python3 test_audit.py

      # 变异测试:逐条破坏规则,断言测试确实会变红。
      # 没有这一步,上面那个绿灯证明不了任何事 —— 一个永远绿的测试套件,
      # 看起来和真测试一模一样。
      - name: Gateway 变异测试（证明测试能变红）
        if: always()
        run: products/gateway/mutation_check.sh
