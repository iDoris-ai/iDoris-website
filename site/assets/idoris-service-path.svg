<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#111111" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0,0 L14,7 L0,14 z" fill="#FF5A1F"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="#FAFAF7"/>
  <rect width="1600" height="900" fill="url(#grid)"/>

  <text x="90" y="95" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" letter-spacing="4" fill="#FF5A1F">THE iDORIS PATH</text>
  <text x="90" y="160" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="800" fill="#111111">From curiosity to AI that works.</text>
  <text x="90" y="205" font-family="Arial, Helvetica, sans-serif" font-size="23" fill="#6E6E68">One applied-AI partner. Three levels of engagement. Start where you are.</text>

  <!-- connecting path -->
  <line x1="320" y1="472" x2="1280" y2="472" stroke="#FF5A1F" stroke-width="8" marker-end="url(#arrow)"/>

  <!-- stage 1 -->
  <rect x="90" y="300" width="410" height="350" rx="0" fill="#FAFAF7" stroke="#111111" stroke-width="3"/>
  <rect x="90" y="300" width="410" height="18" fill="#FF5A1F"/>
  <text x="125" y="365" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#FF5A1F">01 / DISCOVER</text>
  <text x="125" y="420" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#111111">AI Discovery</text>
  <text x="125" y="465" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6E6E68">Schools · universities · communities</text>
  <text x="125" y="525" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111111">Make AI understandable.</text>
  <text x="125" y="565" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#111111">
    <tspan x="125" dy="0">Playful projects, beginner coding,</tspan>
    <tspan x="125" dy="30">creative challenges and hackathon kits.</tspan>
  </text>
  <rect x="125" y="610" width="190" height="34" fill="#111111"/>
  <text x="140" y="634" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#FAFAF7">OUTCOME: CURIOSITY</text>

  <!-- stage 2 -->
  <rect x="595" y="300" width="410" height="350" rx="0" fill="#FAFAF7" stroke="#111111" stroke-width="3"/>
  <rect x="595" y="300" width="410" height="18" fill="#FF5A1F"/>
  <text x="630" y="365" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#FF5A1F">02 / LEARN</text>
  <text x="630" y="420" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#111111">AI Training</text>
  <text x="630" y="465" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6E6E68">Teams · staff · operators</text>
  <text x="630" y="525" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111111">Build capability through work.</text>
  <text x="630" y="565" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#111111">
    <tspan x="630" dy="0">Hands-on sessions around real roles.</tspan>
    <tspan x="630" dy="30">We build the first useful workflow together.</tspan>
  </text>
  <rect x="630" y="610" width="220" height="34" fill="#111111"/>
  <text x="645" y="634" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#FAFAF7">OUTCOME: CAPABILITY</text>

  <!-- stage 3 -->
  <rect x="1100" y="300" width="410" height="350" rx="0" fill="#FAFAF7" stroke="#111111" stroke-width="3"/>
  <rect x="1100" y="300" width="410" height="18" fill="#FF5A1F"/>
  <text x="1135" y="365" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#FF5A1F">03 / IMPLEMENT</text>
  <text x="1135" y="420" font-family="Arial, Helvetica, sans-serif" font-size="38" font-weight="800" fill="#111111">AI Implementation</text>
  <text x="1135" y="465" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#6E6E68">Organizations · businesses · institutions</text>
  <text x="1135" y="525" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#111111">Put AI inside real operations.</text>
  <text x="1135" y="565" font-family="Arial, Helvetica, sans-serif" font-size="19" fill="#111111">
    <tspan x="1135" dy="0">Integrate proven tools and APIs.</tspan>
    <tspan x="1135" dy="30">Build the missing industry-specific pieces.</tspan>
  </text>
  <rect x="1135" y="610" width="270" height="34" fill="#111111"/>
  <text x="1150" y="634" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#FAFAF7">OUTCOME: WORKING SYSTEMS</text>

  <!-- feedback loop -->
  <path d="M1395 705 C1395 815, 205 815, 205 705" fill="none" stroke="#111111" stroke-width="3" stroke-dasharray="12 10" marker-end="url(#arrow)"/>
  <rect x="570" y="760" width="460" height="62" fill="#FAFAF7" stroke="#111111" stroke-width="2"/>
  <text x="800" y="787" text-anchor="middle" font-family="Courier New, monospace" font-size="18" font-weight="700" fill="#111111">MEASURE · LEARN · IMPROVE · EXPAND</text>
  <text x="800" y="812" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#6E6E68">Implementation feeds new learning; learning reveals the next opportunity.</text>

  <text x="90" y="865" font-family="Courier New, monospace" font-size="16" font-weight="700" fill="#111111">iDORIS · APPLIED AI PARTNER</text>
</svg>