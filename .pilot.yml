# .pilot.yml — pilot skill 读它取分支与清理策略。
# 脚本本身不解析 YAML;由 skill 读出后作为 flag 传进去,保持确定简单。

base_branch: main            # 主干。Cloudflare Pages 的 production 分支就是它,
                             # 合进来即代表「要发布」。禁止直推/直合。
integration_branch: preview  # PR 合并进这里。preview → main 的晋升是一次人做的动作
                             # —— git-guard 永远拒绝把 PR 合进主干,这是设计不是故障。
protect_patterns:
  - release
  - hotfix
remote: origin
docs_dir: docs/agent

# 本仓库还没有 docs/agent/ 那套规划文档(现有的 docs/ROADMAP.md 是产品规划稿,不是
# pilot 的运行态文档)。保持 docs 意味着 `pilot run` 起跑前会拦下来要求先 `pilot plan`
# —— 这是想要的行为:宁可它说「规划不全」,也不要改成 external 让门禁在什么都没检查的
# 情况下放行。真要用外部规划再改,并且明白 external 是一句人做的担保。
planning_source: docs

# 外部 PR 评审 daemon 的根目录(默认值,写出来是为了显式)。
pr_daemon_root: ~/Dev/tools/PR-Daemon
